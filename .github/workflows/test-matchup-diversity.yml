name: Jarvis Matchup Diversity Tests
on:
  pull_request:
    paths:
      - 'main.py'
      - 'jarvis/stats/matchup_history.py'
      - 'tests/test_matchup_history.py'
      - 'jarvis/stats/matchup_debug.py'
      - 'tests/test_matchup_debug.py'
      - '.github/workflows/test-matchup-diversity.yml'
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile changed Python files
        run: python -m py_compile main.py jarvis/stats/matchup_history.py tests/test_matchup_history.py jarvis/stats/matchup_debug.py tests/test_matchup_debug.py
      - name: Run matchup history tests
        run: python -m unittest discover -s tests -p 'test_matchup_history.py' -v
      - name: Run matchup diagnostics tests
        run: python -m unittest discover -s tests -p 'test_matchup_debug.py' -v
      - name: Run existing fairness regressions
        run: python -m unittest discover -s tests -p 'test_team_fairness.py' -v

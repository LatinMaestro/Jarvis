name: Jarvis CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  offline-smoke:
    runs-on: ubuntu-latest
    env:
      DISCORD_BOT_TOKEN: ""
      MR_API_KEY: ""
      MR_DB_PATH: ""
      MR_DB_SEED_PATH: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Compile bot
        run: python -S -m py_compile main.py
      - name: Inspect snapshot fixture
        run: python scripts/inspect_jarvis_db.py
      - name: Run offline smoke checks
        run: python scripts/jarvis_offline_smoke.py
      - name: Generate snapshot regression outputs
        run: python scripts/generate_db_sample_outputs.py
      - name: Verify committed baseline is current
        run: cmp .tmp/sample_outputs.md sample_outputs_from_uploaded_db.md
      - name: Upload regression output
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-snapshot-regression-output
          path: .tmp/sample_outputs.md
          if-no-files-found: error
